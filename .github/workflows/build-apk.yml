name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Tests unitarios
        run: ./gradlew --no-daemon :taller:testDebugUnitTest

      - name: Compilar APKs (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AlertaPrueba.apk
          cp taller/build/outputs/apk/debug/taller-debug.apk TallerAceite.apk

      - name: Subir APKs como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            TallerAceite.apk
            AlertaPrueba.apk

      - name: Publicar APKs en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" TallerAceite.apk AlertaPrueba.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APKs (${GITHUB_REF_NAME})" \
            --notes "APKs compilados desde ${GITHUB_SHA}. Descarga TallerAceite.apk (app del taller) e instálalo en tu Android."
