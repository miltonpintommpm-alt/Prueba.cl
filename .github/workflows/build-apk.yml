name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AlertaPrueba.apk
          cp salud/build/outputs/apk/debug/salud-debug.apk NutriFoto.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AlertaPrueba-apk
          path: AlertaPrueba.apk

      - name: Subir APK de NutriFoto como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NutriFoto-apk
          path: NutriFoto.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" AlertaPrueba.apk NutriFoto.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Apps de prueba (${GITHUB_REF_NAME})" \
            --notes "APKs compilados desde ${GITHUB_SHA}: NutriFoto.apk (calorías por foto y plan de salud) y AlertaPrueba.apk."
