name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Compilar APK (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AlertaPrueba.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AlertaPrueba-apk
          path: AlertaPrueba.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" AlertaPrueba.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Alerta Prueba (${GITHUB_REF_NAME})" \
            --notes "APK de prueba compilado desde ${GITHUB_SHA}. Descarga AlertaPrueba.apk e instálalo en tu Android."
