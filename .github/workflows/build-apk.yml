name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APKs (debug)
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AlertaPrueba.apk
          cp carpinteria/build/outputs/apk/debug/carpinteria-debug.apk MaestroCarpintero.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: AlertaPrueba-apk
          path: AlertaPrueba.apk

      - name: Subir APK Maestro Carpintero como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MaestroCarpintero-apk
          path: MaestroCarpintero.apk

      - name: Publicar APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" AlertaPrueba.apk MaestroCarpintero.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "APKs de prueba (${GITHUB_REF_NAME})" \
            --notes "APK de prueba compilado desde ${GITHUB_SHA}. Descarga MaestroCarpintero.apk (o AlertaPrueba.apk) e instálalo en tu Android."
