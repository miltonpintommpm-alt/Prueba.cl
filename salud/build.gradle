plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.prueba.salud'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.prueba.salud'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module', 'META-INF/versions/**', 'META-INF/LICENSE*', 'META-INF/NOTICE*',
                         'META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/*.version']
        }
    }
}

dependencies {
    // SDK oficial de Anthropic para Java (análisis de fotos con Claude)
    implementation 'com.anthropic:anthropic-java:3.3.0'
    implementation 'androidx.core:core:1.13.1'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.3'
}
