plugins {
    id 'com.android.application'
}

android {
    namespace 'cl.prueba.taller'
    compileSdk 35

    defaultConfig {
        applicationId 'cl.prueba.taller'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Reconocimiento de texto (OCR) en el teléfono, sin internet: lee el odómetro.
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // FileProvider para la cámara y para compartir imágenes.
    implementation 'androidx.core:core:1.13.1'
    // Alinea kotlin-stdlib-jdk7/jdk8 (transitivas) con kotlin-stdlib para evitar clases duplicadas.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    testImplementation 'junit:junit:4.13.2'
}
